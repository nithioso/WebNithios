# Vista previa temporal en GitHub Pages mientras se resuelve el dominio nithios.com.
# Producción será Hostinger (ver docs/ARQUITECTURA.md). La vista previa va con noindex.
name: Vista previa (GitHub Pages)

on:
  push:
    branches: ['joc/cool-hypatia-6dn972', 'main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Adaptar rutas a la base de Pages
        run: node scripts/pages-preview.mjs
        env:
          PAGES_BASE: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
